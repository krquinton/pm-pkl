<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickleManage — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2f332e; --navy-deep:#222622;
    --gold:#6cc144; --orange:#ff6600; --blue:#3992b9; --red:#bb1421;
    --bg:#141714; --surface:#1e231e; --surface-2:#191d19;
    --text:#eef1ec; --muted:#9aa49a; --border:#2f372f;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --gold:#4f9d2d; --bg:#ececec; --surface:#ffffff; --surface-2:#f7f7f5;
    --text:#262a26; --muted:#6a706a; --border:#dcdddb;
    --shadow: 0 8px 24px rgba(38,42,38,0.1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  h1,h2,h3,.headline{font-family:'Baloo 2',system-ui,sans-serif;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:2vw;
    padding:0 2vw;height:11vh;flex-shrink:0;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    box-shadow:var(--shadow);position:relative;z-index:5;
  }
  header.top .brand{display:flex;align-items:center;}
  header.top .brand img{height:8.6vh;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  header.top h1{margin:0;color:#fff;font-size:min(4.8vh,2.4vw);font-weight:800;text-align:center;letter-spacing:.2px;}
  header.top .brand.right img{height:8.2vh;border-radius:1vh;}
  header.top .titlewrap{flex:1;text-align:center;min-width:0;}
  header.top .subline{color:var(--gold);font-weight:700;font-size:min(2.4vh,1.25vw);margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .theme-toggle{position:absolute;top:8px;right:8px;width:40px;height:22px;background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);border-radius:14px;cursor:pointer;z-index:10;opacity:.6;}
  .theme-toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--gold);
    transition:transform .2s ease;font-size:9px;display:flex;align-items:center;justify-content:center;}
  html[data-theme="light"] .theme-toggle .knob{transform:translateX(18px);background:var(--blue);}

  main{flex:1;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:1.2vw;padding:1.6vh 1.2vw;overflow:hidden;min-height:0;}
  .col{display:grid;grid-template-rows:1fr 1fr;gap:1.6vh;min-height:0;min-width:0;}

  .court-card{
    background:var(--surface);border:.45vh solid var(--border);border-radius:2vh;
    padding:1.6vh 1.5vw;box-shadow:var(--shadow);display:flex;flex-direction:column;
    justify-content:space-between;min-height:0;min-width:0;overflow:hidden;
  }
  .court-card.playing{border-color:var(--orange);}
  .court-card.assigned{border-color:var(--blue);}
  .court-num{
    font-family:'Baloo 2';font-weight:800;font-size:min(4vh,2.2vw);color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;justify-content:space-between;line-height:1;
  }
  .court-status-pill{font-size:min(2.3vh,1.25vw);font-weight:800;padding:.6vh 1vw;border-radius:5vh;color:#fff;letter-spacing:0;}
  .court-status-pill.free{background:#2e9e5b;}
  .court-status-pill.playing{background:var(--orange);}
  .court-status-pill.assigned{background:var(--blue);}
  .players{display:flex;flex-direction:column;min-width:0;}
  .players .p{font-family:'Baloo 2';font-weight:800;font-size:min(4.6vh,2.7vw);line-height:1.1;white-space:nowrap;overflow:hidden;}
  .players .vs{color:var(--gold);font-family:'Baloo 2';font-weight:800;font-size:min(2.6vh,1.5vw);margin:.5vh 0;letter-spacing:.2em;}
  .court-card .timer{font-family:'Baloo 2';font-weight:800;font-size:min(8.6vh,5vw);line-height:1;color:var(--gold);
    text-align:center;font-variant-numeric:tabular-nums;}
  .court-card .ready-note{font-family:'Baloo 2';font-weight:800;font-size:min(4vh,2.3vw);line-height:1;color:var(--blue);text-align:center;}
  .court-card .free-label{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;
    font-size:min(6vh,3.4vw);color:var(--muted);}

  .center-col{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .center-title{font-family:'Baloo 2';font-weight:800;font-size:min(4.4vh,2.5vw);text-align:center;line-height:1;
    color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin-bottom:1.4vh;}
  .next-list{flex:1;display:grid;grid-template-rows:repeat(6,1fr);gap:1.4vh;min-height:0;}
  .next-item{background:var(--surface);border:.2vh solid var(--border);border-left:1vh solid var(--blue);
    border-radius:1.6vh;padding:0 1.2vw;box-shadow:var(--shadow);display:flex;align-items:center;gap:1.2vw;
    min-height:0;min-width:0;overflow:hidden;}
  .next-item.onhold{border-left-color:var(--muted);}
  .next-item.onhold .pos,.next-item.onhold .info{opacity:.45;}
  .next-item .hold-tag{font-family:'Baloo 2';font-weight:800;font-size:min(3.2vh,1.8vw);color:var(--gold);flex-shrink:0;white-space:nowrap;}
  .next-item.empty{border-style:dashed;border-left-style:dashed;box-shadow:none;background:transparent;opacity:.45;}
  .next-item .pos{font-family:'Baloo 2';font-weight:800;font-size:min(6vh,3.4vw);color:var(--gold);width:3.2vw;text-align:center;flex-shrink:0;}
  .next-item .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .next-item .tline{font-family:'Baloo 2';font-weight:800;font-size:min(4.1vh,2.3vw);line-height:1.12;white-space:nowrap;overflow:hidden;}
  .next-item .tline.b{color:var(--muted);}
  .next-item .tline.b span{color:var(--gold);font-size:.7em;letter-spacing:.15em;margin-right:.5em;}
  .next-item .empty-text{font-family:'Baloo 2';font-weight:700;font-size:min(3.6vh,2vw);color:var(--muted);}

  /* Popups */
  .tv-overlay{position:fixed;inset:0;background:rgba(10,13,10,.86);display:none;align-items:center;justify-content:center;z-index:80;}
  .tv-overlay.show{display:flex;}
  .tv-popup{background:var(--surface);border-radius:28px;padding:clamp(30px,4vw,60px) clamp(40px,6vw,90px);
    text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);border:3px solid var(--gold);max-width:90vw;}
  .tv-popup.winner{border-color:#2e9e5b;}
  .tv-popup .kicker{font-family:'Baloo 2';font-weight:800;font-size:min(5vh,3vw);color:var(--gold);
    text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
  .tv-popup.winner .kicker{color:#3ecb7c;}
  .tv-popup .court-big{font-size:min(4.6vh,2.8vw);color:var(--muted);margin-bottom:18px;font-weight:600;}
  .tv-popup .teams-big{font-family:'Baloo 2';font-weight:800;font-size:min(8.5vh,5.4vw);line-height:1.25;}
  .tv-popup .score-big{font-family:'Baloo 2';font-weight:800;font-size:min(13vh,8vw);color:var(--gold);margin-top:14px;}
  .tv-popup .winner-name{font-family:'Baloo 2';font-weight:800;font-size:min(10vh,6vw);color:#3ecb7c;margin-top:6px;}

  @media (max-width: 900px){ html,body{height:auto;} body{overflow:auto;} main{grid-template-columns:1fr;} }
  .court-bucket{font-family:'Baloo 2';font-weight:700;font-size:min(2.3vh,1.3vw);color:var(--gold);letter-spacing:0;text-transform:none;margin-left:.8vw;}
  .next-item .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex-shrink:0;max-width:14vw;}
  .next-item .bucket-sm{font-family:'Baloo 2';font-weight:700;font-size:min(2.4vh,1.35vw);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1;}
  .players .team{display:flex;flex-direction:column;min-width:0;}
  /* queue hidden: courts take the whole screen (still 2 x 2), bigger type, team names side by side */
  body.no-queue main{grid-template-columns:1fr 1fr;}
  body.no-queue .center-col{display:none;}
  body.no-queue .court-num{font-size:min(5.2vh,3vw);}
  body.no-queue .court-status-pill{font-size:min(3vh,1.7vw);}
  body.no-queue .court-bucket{font-size:min(3vh,1.7vw);}
  body.no-queue .players .team{flex-direction:row;gap:1.4vw;}
  body.no-queue .players .team .p{font-size:min(7.4vh,4.4vw);min-width:0;flex:0 1 auto;}
  body.no-queue .players .team .p + .p::before{content:'& ';color:var(--muted);}
  body.no-queue .players .vs{font-size:min(3.6vh,2vw);margin:.8vh 0;}
  body.no-queue .court-card .timer{font-size:min(13vh,8vw);}
  body.no-queue .court-card .ready-note{font-size:min(5.6vh,3.2vw);}
  body.no-queue .court-card .free-label{font-size:min(8.4vh,5vw);}
  /* leaderboard popup (sits under the call / winner popups, z-index 80) */
  .lb-overlay{position:fixed;inset:0;background:rgba(10,13,10,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:70;padding:3vh 3vw;}
  .lb-overlay.show{display:flex;}
  .lb-title{font-family:'Baloo 2';font-weight:800;font-size:min(7vh,4.2vw);color:var(--gold);text-transform:uppercase;letter-spacing:.12em;line-height:1;margin-bottom:.8vh;text-align:center;}
  .lb-sub{font-family:'Baloo 2';font-weight:700;font-size:min(3vh,1.8vw);color:var(--muted);margin-bottom:3vh;text-align:center;}
  .lb-cols{display:grid;gap:2vw;width:100%;flex:1;min-height:0;}
  .lb-col{background:var(--surface);border:.4vh solid var(--border);border-radius:2vh;padding:2vh 1.6vw;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);}
  .lb-col h3{margin:0 0 1.6vh;font-size:min(5vh,2.8vw);color:var(--gold);text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-row{display:flex;align-items:center;gap:1vw;flex:1;min-height:0;border-top:.2vh solid var(--border);}
  .lb-row:first-of-type{border-top:none;}
  .lb-rank{font-family:'Baloo 2';font-weight:800;font-size:min(6vh,3.4vw);color:var(--gold);width:3.4vw;text-align:center;flex-shrink:0;}
  .lb-name{flex:1;min-width:0;font-family:'Baloo 2';font-weight:800;font-size:min(4.8vh,2.7vw);white-space:nowrap;overflow:hidden;}
  .lb-stat{font-family:'Baloo 2';font-weight:800;font-size:min(3.4vh,1.9vw);color:var(--muted);text-align:right;flex-shrink:0;line-height:1.1;}
  .lb-stat b{color:var(--text);font-size:1.25em;}
  .lb-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:'Baloo 2';font-weight:700;font-size:min(4vh,2.2vw);}
  header.top h1{flex:1;min-width:0;}
  header.top .brand img{height:8.2vh;border-radius:1vh;}
  /* ===== v2: stacked layout (any court count other than 4): one column of courts, queue on the far right ===== */
  body.stacked main{grid-template-columns:1.8fr 1fr;}
  body.stacked.no-queue main{grid-template-columns:1fr;}
  body.stacked .col.stack{display:grid;gap:1.2vh;min-height:0;min-width:0;}
  body.stacked .court-card{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,3.5fr) minmax(0,1fr);align-items:center;column-gap:1.2vw;padding:.8vh 1.2vw;border-width:.4vh;border-radius:1.6vh;}
  body.stacked .court-num{flex-direction:column;align-items:flex-start;justify-content:center;gap:.7vh;font-size:min(3.6vh,2vw);letter-spacing:.05em;white-space:nowrap;}
  body.stacked .court-status-pill{white-space:nowrap;}
  body.stacked .court-num > span:first-child{display:flex;flex-direction:column;gap:.3vh;}
  body.stacked .court-bucket{margin-left:0;font-size:min(2vh,1.1vw);}
  body.stacked .court-status-pill{font-size:min(1.9vh,1.05vw);padding:.4vh .7vw;}
  body.stacked .court-card .timer{font-size:min(6.6vh,3.6vw);text-align:right;}
  body.stacked .court-card .ready-note{font-size:min(2.6vh,1.5vw);line-height:1.1;text-align:right;}
  body.stacked .court-card .free-label{grid-column:2 / 4;font-size:min(5vh,2.8vw);}

  /* names: big, bold, high contrast */
  .players .p,.players .oneline .n{color:var(--text);text-shadow:0 1px 0 rgba(0,0,0,.25);}
  /* doubles in the stacked layout: team 1 + VS on the first line, team 2 on the second */
  body.stacked .players.duo{justify-content:center;gap:.2vh;min-width:0;}
  body.stacked .players.duo .tl{display:flex;align-items:baseline;justify-content:flex-start;gap:2.4vw;min-width:0;}
  body.stacked .players.duo .tl .p{flex:0 1 auto;min-width:0;font-size:min(5.6vh,3.1vw);line-height:1.12;}
  body.stacked .players.duo .tl .vs{flex:0 0 auto;margin:0;font-size:min(3.4vh,1.9vw);line-height:1;color:var(--gold);letter-spacing:.12em;}
  /* singles: everything on ONE line (both layouts) */
  .players.single{justify-content:center;min-width:0;}
  .players .oneline{display:flex;align-items:baseline;justify-content:center;gap:.7em;white-space:nowrap;overflow:hidden;
    font-family:'Baloo 2';font-weight:800;line-height:1.12;font-size:min(4.6vh,2.7vw);}
  .players .oneline .n{flex:0 0 auto;}
  .players .oneline .vs{flex:0 0 auto;margin:0;font-size:.55em;letter-spacing:.14em;color:var(--gold);}
  body.stacked .players .oneline{font-size:min(7vh,3.8vw);justify-content:flex-start;}
  body.no-queue:not(.stacked) .players .oneline{font-size:min(7.4vh,4.4vw);}

  /* queue hidden: same single column, cards just get bigger */
  body.stacked.no-queue .court-num{font-size:min(4.4vh,2.4vw);}
  body.stacked.no-queue .court-status-pill{font-size:min(2.3vh,1.3vw);}
  body.stacked.no-queue .court-bucket{font-size:min(2.4vh,1.3vw);}
  body.stacked.no-queue .players.duo .tl .p{font-size:min(6.4vh,4.6vw);}
  body.stacked.no-queue .players.duo .tl .vs{font-size:min(4vh,2.4vw);}
  body.stacked.no-queue .players .oneline{font-size:min(8.2vh,5.4vw);}
  body.stacked.no-queue .court-card .timer{font-size:min(9.6vh,5.4vw);}
  body.stacked.no-queue .court-card .ready-note{font-size:min(3.4vh,2vw);}
  body.stacked.no-queue .court-card .free-label{font-size:min(7vh,4vw);}
</style>
</head>

    <div class="teams-big" id="winnerTeams"></div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDhWLbY2QERNuOn7R-g8VljB4VTKW9RgEs",
  authDomain: "pklbox-e01b3.firebaseapp.com",
  projectId: "pklbox-e01b3",
  storageBucket: "pklbox-e01b3.firebasestorage.app",
  messagingSenderId: "197030960226",
  appId: "1:197030960226:web:529888c44967b2c30d853b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let COURTS = Number(localStorage.getItem('pkl-tv-courts')) || 4;   // live from pkl-queue-session/state.courtCount (1-5)
if (COURTS < 1 || COURTS > 5) COURTS = 4;

/* Theme */
const html = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const themeKnob = document.getElementById('themeKnob');
function applyTheme(t){ html.setAttribute('data-theme', t); themeKnob.textContent = t==='light' ? '☀️' : '🌙'; localStorage.setItem('pkl-tv-theme', t); }
applyTheme(localStorage.getItem('pkl-tv-theme') || 'dark');
themeToggle.addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let queueMatches = [];
let bucketsMap = {};
/* bucket name is shown only for buckets limited to specific courts */
function bucketTag(id){
  const b = bucketsMap[id];
  if (!b || !b.courts) return '';
  const l = b.courts.filter(c => c <= COURTS);
  return l.length && l.length < COURTS ? b.name : '';
}
db.collection('pkl-queue-buckets').onSnapshot(snap => {
  bucketsMap = {};
  snap.docs.forEach(d => { const x = d.data(); bucketsMap[d.id] = { name: x.name || '', courts: Array.isArray(x.courts) ? x.courts.map(Number) : [] }; });
  renderCourts();
  renderNextList();
}, err => console.error(err));

db.collection('pkl-queue-matches').onSnapshot(snap => {
  queueMatches = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderCourts();
  renderNextList();
}, err => console.error(err));

function courtBucketHtml(m){ const t = bucketTag(m.bucket); return t ? `<span class="court-bucket">${escapeHtml(t)}</span>` : ''; }
function playersHtml(team){ return `<div class="team">${team.map(p=>`<div class="p fit">${escapeHtml(p.name)}</div>`).join('')}</div>`; }

function matchBodyHtml(m){
  const n1 = m.team1.map(p => escapeHtml(p.name)).join(' &amp; ');
  const n2 = m.team2.map(p => escapeHtml(p.name)).join(' &amp; ');
  if (m.team1.length === 1 && m.team2.length === 1) {
    return `<div class="players single"><div class="oneline fit"><span class="n">${n1}</span><span class="vs">VS</span><span class="n">${n2}</span></div></div>`;
  }
  if (COURTS !== 4) {
    return `<div class="players duo"><div class="tl"><div class="p fit">${n1}</div><div class="vs">VS</div></div><div class="tl"><div class="p fit">${n2}</div></div></div>`;
  }
  return `<div class="players">${playersHtml(m.team1)}<div class="vs">VS</div>${playersHtml(m.team2)}</div>`;
}

function renderCourts(){
  const occupying = queueMatches.filter(m => m.status==='assigned' || m.status==='playing');
  for (let c=1;c<=COURTS;c++){
    const el = document.getElementById('court-'+c);
    if (!el) continue;
    const m = occupying.find(x => x.court === c);
    if (!m) {
      el.className = 'court-card';
      el.innerHTML = `
        <div class="court-num">Court ${c}<span class="court-status-pill free">Available</span></div>
        <div class="free-label">Open court</div>`;
      continue;
    }
    const body = matchBodyHtml(m);
    if (m.status === 'playing'){
      el.className = 'court-card playing';
      el.innerHTML = `
        <div class="court-num"><span>Court ${c}${courtBucketHtml(m)}</span><span class="court-status-pill playing">Playing</span></div>
        ${body}
        <div class="timer" data-started="${m.startedAt}">00:00</div>`;
    } else {
      el.className = 'court-card assigned';
      el.innerHTML = `
        <div class="court-num"><span>Court ${c}${courtBucketHtml(m)}</span><span class="court-status-pill assigned">Getting ready</span></div>
        ${body}
        <div class="ready-note">Please proceed to the court</div>`;
    }
  }
  updateTimers();
  fitAll();
}
function updateTimers(){
  document.querySelectorAll('.timer').forEach(el => {
    const started = Number(el.dataset.started);
    if (!started) return;
    const secs = Math.max(0, Math.floor((Date.now() - started) / 1000));
    el.textContent = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
  });
}
setInterval(updateTimers, 1000);

const NEXT_SLOTS = 6;
function renderNextList(){
  const list = queueMatches.filter(m => m.status === 'waiting' || m.status === 'onhold').sort((a,b) => a.order - b.order).slice(0, NEXT_SLOTS);
  const el = document.getElementById('nextList');
  let html = '';
  for (let i=0;i<NEXT_SLOTS;i++){
    const m = list[i];
    if (!m) {
      html += `<div class="next-item empty"><div class="pos">${i+1}</div><div class="info"><div class="empty-text">—</div></div></div>`;
      continue;
    }
    html += `
    <div class="next-item${m.status === 'onhold' ? ' onhold' : ''}">
      <div class="pos">${i+1}</div>
      <div class="info">
        <div class="tline fit">${escapeHtml(m.team1.map(p=>p.name).join(' & '))}</div>
        <div class="tline b fit"><span>VS</span>${escapeHtml(m.team2.map(p=>p.name).join(' & '))}</div>
      </div>
      ${(bucketTag(m.bucket) || m.status === 'onhold') ? `<div class="side">${bucketTag(m.bucket) ? `<div class="bucket-sm">${escapeHtml(bucketTag(m.bucket))}</div>` : ''}${m.status === 'onhold' ? '<div class="hold-tag">(On Hold)</div>' : ''}</div>` : ''}
    </div>`;
  }
  el.innerHTML = html;
  fitAll();
}

/* shrink text only when a name would overflow its line, so long names stay fully visible */
function fitAll(){
  requestAnimationFrame(() => {
    document.querySelectorAll('.fit').forEach(el => {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > 14 && guard < 120) {
        size -= 1; el.style.fontSize = size + 'px'; guard++;
      }
    });
    /* both team lines of a stacked doubles card share the smaller size so they look even */
    document.querySelectorAll('.players.duo').forEach(card => {
      const ps = [...card.querySelectorAll('.p.fit')];
      if (ps.length < 2) return;
      const min = Math.min(...ps.map(p => parseFloat(getComputedStyle(p).fontSize)));
      ps.forEach(p => { p.style.fontSize = min + 'px'; });
    });
  });
}
window.addEventListener('resize', fitAll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

/* Session name (center of the header) */
db.collection('pkl-queue-session').doc('state').onSnapshot(doc => {
  const d = doc.exists ? doc.data() : {};
  const cc = Number(d.courtCount);
  const n = (cc >= 1 && cc <= 5) ? Math.floor(cc) : 4;
  if (n !== COURTS) { COURTS = n; localStorage.setItem('pkl-tv-courts', String(n)); buildLayout(); }
  const name = d.currentSessionName || '';
  document.getElementById('sessionTitle').textContent = name;
  document.getElementById('sessionSep').style.display = name ? '' : 'none';
  document.title = name ? name + ' — PickleManage' : 'PickleManage';
}, err => console.error(err));

/* Display settings from the admin: show/hide the queue, leaderboard popup */
let displaySettings = {};
db.collection('pkl-queue-events').doc('displaySettings').onSnapshot(doc => {
  displaySettings = doc.exists ? doc.data() : {};
  applyDisplaySettings();
}, err => console.error(err));
function applyDisplaySettings(){
  const showQueue = displaySettings.showQueue !== false;
  document.body.classList.toggle('no-queue', !showQueue);
  renderLeaderboardPopup();
  fitAll();
  setTimeout(fitAll, 150);
}
function renderLeaderboardPopup(){
  const ov = document.getElementById('lbOverlay');
  const lb = displaySettings.leaderboard;
  if (!lb || !lb.show) { ov.classList.remove('show'); return; }
  const buckets = (lb.buckets || []).slice(0, 3);
  document.getElementById('lbSub').textContent = (lb.sessionName ? lb.sessionName + ' · ' : '') + 'Top 5 per bucket';
  const cols = document.getElementById('lbCols');
  cols.style.gridTemplateColumns = `repeat(${Math.max(1, buckets.length)}, 1fr)`;
  cols.innerHTML = buckets.map(b => `
    <div class="lb-col">
      <h3>${escapeHtml(b.name)}</h3>
      ${(b.rows && b.rows.length) ? b.rows.map(r => `
        <div class="lb-row">
          <div class="lb-rank">${r.rank}</div>
          <div class="lb-name fit">${escapeHtml(r.name)}</div>
          <div class="lb-stat"><b>${r.w}</b> W<br>${r.pf} pts</div>
        </div>`).join('') : `<div class="lb-empty">No results yet</div>`}
    </div>`).join('');
  ov.classList.add('show');
  fitAll();
}

/* TV events: call players / winner popups */
let eventsInitialized = false;
let lastEventId = null;
db.collection('pkl-queue-events').orderBy('createdAt','desc').limit(1).onSnapshot(snap => {
  if (snap.empty) { eventsInitialized = true; return; }
  const doc = snap.docs[0];
  const data = doc.data();
  if (!data.createdAt) return; // still-pending serverTimestamp write; wait for the confirmed snapshot
  if (!eventsInitialized) { eventsInitialized = true; lastEventId = doc.id; return; }
  if (doc.id === lastEventId) return;
  lastEventId = doc.id;
  const ageMs = Date.now() - data.createdAt.toMillis();
  if (ageMs > 15000) return;
  if (data.type === 'call') showCallPopup(data);
  else if (data.type === 'winner') showWinnerPopup(data);
}, err => console.error(err));

function showCallPopup(data){
  const t1 = data.team1.join(' & ');
  const t2 = data.team2.join(' & ');
  document.getElementById('callCourt').textContent = `Court ${data.court}`;
  document.getElementById('callTeams').innerHTML = `${escapeHtml(t1)}<br><span style="color:var(--muted);font-size:.6em;">vs</span><br>${escapeHtml(t2)}`;
  const ov = document.getElementById('callOverlay');
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 5000);
}
function showWinnerPopup(data){
  const t1 = data.team1.join(' & ');
  const t2 = data.team2.join(' & ');
  const winnerNames = data.winner === 'team1' ? t1 : t2;
  document.getElementById('winnerCourt').textContent = `Court ${data.court}`;
  document.getElementById('winnerTeams').innerHTML = `${escapeHtml(t1)} <span style="color:var(--muted);font-size:.5em;">vs</span> ${escapeHtml(t2)}`;
  document.getElementById('winnerScore').textContent = `${data.score1} – ${data.score2}`;
  document.getElementById('winnerName').textContent = winnerNames;
  const ov = document.getElementById('winnerOverlay');
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 5000);
}

/* Layout: exactly 4 courts keeps the 2 x 2 grid with the queue in the middle.
   Any other count stacks the courts in ONE column and moves the queue to the far right. */
function buildLayout(){
  const main = document.getElementById('mainGrid');
  const n = COURTS;
  const card = c => `<div class="court-card" id="court-${c}"></div>`;
  const queue = `<div class="col center-col"><div class="center-title">Up Next</div><div class="next-list" id="nextList"></div></div>`;
  document.body.classList.toggle('stacked', n !== 4);
  document.body.setAttribute('data-courts', String(n));
  if (n === 4) {
    main.innerHTML = `<div class="col courts">${card(1)}${card(2)}</div>${queue}<div class="col courts">${card(3)}${card(4)}</div>`;
  } else {
    main.innerHTML = `<div class="col courts stack" style="grid-template-rows:repeat(${n},minmax(0,1fr))">${Array.from({length:n},(_,i)=>card(i+1)).join('')}</div>${queue}`;
  }
  renderCourts();
  renderNextList();
}
buildLayout();
</script>
